name: Release

# Stages the package on npm when a GitHub release is published. Uses npm
# trusted publishing (OIDC), so there is no npm token. A staged version is not
# public: a maintainer approves it on npmjs.com (with 2FA) to publish it.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      # staged publishing needs npm 11.17 or newer
      - run: npm install -g npm@^11.17.0
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run typecheck
      # prepublishOnly builds and runs the unit tests
      - run: npm stage publish --provenance
