name: Release

# Stages the package on npm when a GitHub release is published. Uses npm
# trusted publishing (OIDC), so there is no npm token. A staged version is not
# public: a maintainer approves it on npmjs.com (with 2FA) to publish it.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # staged publishing needs npm 11.17 or newer
      - run: npm install -g npm@^11.17.0
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run typecheck
      # prepublishOnly builds and runs the unit tests
      - run: npm stage publish --provenance
